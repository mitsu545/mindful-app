<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111318">
<title>mindful</title>
<style>
  /* ---- 全体 ---- */
  :root {
    --bg: #f6f5f2;
    --fg: #1d1f24;
    --sub: #6b6f78;
    --accent: #3f6b5b;
    --card: #ffffff;
    --dark: #111318;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    background: var(--bg); color: var(--fg);
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .screen { display: none; min-height: 100vh; min-height: 100dvh; padding: 24px 20px; }
  .screen.active { display: flex; flex-direction: column; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--sub); font-size: 14px; margin: 0 0 24px; }
  button { font: inherit; border: 0; cursor: pointer; }

  /* ---- 大ボタン（ホーム・時間選択・スコア） ---- */
  .big {
    width: 100%; padding: 26px; margin-bottom: 14px; border-radius: 18px;
    background: var(--card); color: var(--fg); font-size: 20px; font-weight: 600;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  .big.primary { background: var(--accent); color: #fff; }
  .big[disabled] { opacity: .45; }
  .row { display: flex; gap: 10px; }
  .row .big { flex: 1; padding: 22px 0; font-size: 22px; }
  .row .big.on { outline: 3px solid var(--accent); }
  .scores .big { padding: 22px 0; font-size: 26px; }
  .link { background: none; color: var(--sub); text-decoration: underline; padding: 16px; font-size: 15px; align-self: center; }
  .spacer { flex: 1; }

  /* ---- タイマー画面：暗い背景・上下3分割の巨大ボタン ---- */
  #timer { background: var(--dark); color: #e8e8e8; padding: 0; position: relative; }
  #labels { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #labels button {
    flex: 1; background: transparent; color: rgba(255,255,255,.18); font-size: 15px;
    border-top: 1px solid rgba(255,255,255,.06);
    display: flex; align-items: center; justify-content: flex-start; padding-left: 20px; /* 中央の残り時間と重ねない */
  }
  #labels button:first-child { border-top: 0; }
  #overlay {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 24px;
  }
  #remain { font-size: 72px; font-weight: 200; letter-spacing: 2px; font-variant-numeric: tabular-nums; }
  #anchor { font-size: 17px; color: rgba(255,255,255,.7); margin-top: 12px; line-height: 1.5; }

  /* ---- 完了画面 ---- */
  .remind { background: #e9f1ee; border-left: 4px solid var(--accent); padding: 14px 16px; border-radius: 10px; font-size: 15px; line-height: 1.6; margin: 0 0 20px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 20px; }
  td { padding: 8px 4px; border-bottom: 1px solid #e6e6e6; }
  td:first-child { color: var(--sub); width: 42%; }
</style>
</head>
<body>

<!-- ① ホーム -->
<section id="home" class="screen active">
  <h1>mindful</h1>
  <p class="sub">今日の記録：<span id="todayCount">0</span> 件</p>
  <button class="big" disabled>気分を記録（手順3で有効化）</button>
  <button class="big primary" data-go="duration">瞑想する</button>
</section>

<!-- ③-1 時間選択 -->
<section id="duration" class="screen">
  <h1>何分やる？</h1>
  <p class="sub">疲れた日は 1 分でも OK</p>
  <div class="row" id="durations"></div>
  <div class="spacer"></div>
  <button class="big primary" id="toPre">次へ</button>
  <button class="link" data-go="home">ホームへ戻る</button>
</section>

<!-- ③-2 前スコア -->
<section id="pre" class="screen">
  <h1>今の気分は？</h1>
  <p class="sub">1＝とても悪い 〜 5＝とても良い</p>
  <div class="row scores" data-score="pre"></div>
  <div class="spacer"></div>
  <button class="link" id="skipPre">スキップ</button>
</section>

<!-- ③-3 タイマー -->
<section id="timer" class="screen">
  <div id="labels">
    <button data-label="kangae">考え事</button>
    <button data-label="fuan">不安</button>
    <button data-label="keikaku">計画</button>
  </div>
  <div id="overlay">
    <div id="remain">3:00</div>
    <div id="anchor"></div>
  </div>
</section>

<!-- ③-4 後スコア -->
<section id="post" class="screen">
  <h1>終わりました。今の気分は？</h1>
  <p class="sub">1＝とても悪い 〜 5＝とても良い</p>
  <div class="row scores" data-score="post"></div>
  <div class="spacer"></div>
  <button class="link" id="skipPost">スキップ</button>
</section>

<!-- ③-5 完了（非判断リマインド） -->
<section id="done" class="screen">
  <h1>おつかれさま</h1>
  <p class="remind">雑念に気づいて戻した回数こそが、脳のトレーニング成果です。</p>
  <table id="result"></table>
  <p class="sub">※ 手順1のため保存はしません（手順2でスプレッドシートへ送信）</p>
  <div class="spacer"></div>
  <button class="big primary" data-go="home">ホームへ</button>
</section>

<script>
(() => {
  'use strict';
  const DURATIONS = [1, 3, 5, 8, 10];          // 仕様 4-1
  const ANCHORS = [                             // 仕様 4-2（1行ずつ）
    '足の裏の感覚。床に触れている圧力や温度に気づく',
    '坐骨の重み。椅子に乗っているお尻と骨盤を感じる',
    'お腹の上下。呼吸で動くお腹をただ眺める',
  ];
  const RAIN = '感情を責めずにただ認め、お腹や胸の感覚に寄り添いましょう';  // 前スコア1〜2のとき
  const ANCHOR_SWITCH_SEC = 40;                 // アンカー文言を切り替える間隔

  const $ = (sel) => document.querySelector(sel);
  const todayLog = [];                          // 手順1：メモリ上だけ（保存なし）
  let session = null;                           // 現在のセッション
  let timerId = null, anchorId = null, wakeLock = null;

  // ---- 画面遷移 ----
  function go(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
    window.scrollTo(0, 0);
  }
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));

  // ---- 時間選択（初期値 3分） ----
  let duration = 3;
  const durBox = $('#durations');
  DURATIONS.forEach(m => {
    const b = document.createElement('button');
    b.className = 'big' + (m === duration ? ' on' : '');
    b.textContent = m + '分';
    b.addEventListener('click', () => {
      duration = m;
      durBox.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    });
    durBox.appendChild(b);
  });

  // ---- スコアボタン（前・後 共通） ----
  document.querySelectorAll('[data-score]').forEach(box => {
    for (let s = 1; s <= 5; s++) {
      const b = document.createElement('button');
      b.className = 'big';
      b.textContent = s;
      b.addEventListener('click', () => onScore(box.dataset.score, s));
      box.appendChild(b);
    }
  });
  $('#skipPre').addEventListener('click', () => onScore('pre', null));
  $('#skipPost').addEventListener('click', () => onScore('post', null));

  function onScore(kind, score) {
    session[kind] = score;
    if (kind === 'pre') startTimer();
    else finish();
  }

  // ---- 開始 ----
  $('#toPre').addEventListener('click', () => {
    session = {
      session_id: 's-' + String(Date.now()).slice(-6),
      duration_min: duration,
      pre: null, post: null,
      label_kangae: 0, label_fuan: 0, label_keikaku: 0,
    };
    unlockAudio();   // iOS は「ユーザー操作の中」で音を許可する必要がある
    go('pre');
  });

  // ---- タイマー ----
  function startTimer() {
    const endAt = Date.now() + session.duration_min * 60 * 1000;   // 端末のスリープ等でも狂わないよう終了時刻で管理
    const lowMood = session.pre !== null && session.pre <= 2;
    let anchorIdx = 0;
    $('#anchor').textContent = lowMood ? RAIN : ANCHORS[0];
    if (!lowMood) {
      anchorId = setInterval(() => {
        anchorIdx = (anchorIdx + 1) % ANCHORS.length;
        $('#anchor').textContent = ANCHORS[anchorIdx];
      }, ANCHOR_SWITCH_SEC * 1000);
    }
    go('timer');
    requestWakeLock();
    tick(endAt);
    timerId = setInterval(() => tick(endAt), 250);
  }

  function tick(endAt) {
    const left = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    $('#remain').textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    if (left <= 0) {
      clearInterval(timerId); clearInterval(anchorId);
      releaseWakeLock();
      playBell();
      go('post');
    }
  }

  // 雑念ボタン：画面も音も変えず、回数だけ数える（仕様 4-3）
  $('#labels').addEventListener('click', (e) => {
    const key = e.target.dataset.label;
    if (key && session) session['label_' + key]++;
  });

  // ---- 終了 ----
  function finish() {
    const rec = {
      timestamp: fmt(new Date()),
      type: 'pre/post',
      session_id: session.session_id,
      duration_min: session.duration_min,
      pre: session.pre ?? '（スキップ）',
      post: session.post ?? '（スキップ）',
      label_kangae: session.label_kangae,
      label_fuan: session.label_fuan,
      label_keikaku: session.label_keikaku,
    };
    todayLog.push(rec);
    $('#todayCount').textContent = todayLog.length;
    $('#result').innerHTML = Object.entries(rec)
      .map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');
    go('done');
  }

  function fmt(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }

  // ---- 終了音（Web Audio、バイブは iOS 非対応のため未実装） ----
  let audioCtx = null;
  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { audioCtx = null; }
  }
  function playBell() {
    if (!audioCtx) return;
    try {
      const t = audioCtx.currentTime;
      [0, 0.6].forEach((delay) => {          // 2回鳴らす
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine'; osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, t + delay);
        gain.gain.exponentialRampToValueAtTime(0.4, t + delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + delay + 1.2);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(t + delay); osc.stop(t + delay + 1.3);
      });
    } catch (e) { /* 音が出なくても処理は続ける */ }
  }

  // ---- 画面を消さない（対応端末のみ。失敗しても無視） ----
  async function requestWakeLock() {
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { wakeLock = null; }
  }
  function releaseWakeLock() {
    try { wakeLock && wakeLock.release(); } catch (e) {} finally { wakeLock = null; }
  }
})();
</script>
</body>
</html>
